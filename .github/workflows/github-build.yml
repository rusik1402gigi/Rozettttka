name: Build iOS IPA & Sync Capacitor

on:
  push:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project directory
        id: locate
        run: |
          if [ -f "package.json" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "socket-simulator/package.json" ]; then
            echo "dir=socket-simulator" >> $GITHUB_OUTPUT
          else
            FOUND=$(find . -maxdepth 3 -name "package.json" | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "dir=$(dirname "$FOUND")" >> $GITHUB_OUTPUT
            else
              echo "Ошибка: package.json не найден в репозитории!"
              exit 1
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & sync Capacitor
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          mkdir -p www
          if [ ! -f "www/index.html" ] && [ -f "index.html" ]; then
            cp index.html www/index.html
          fi
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build Unsigned iOS App (.app)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          cd ios/App
          if [ -f "Podfile" ]; then
            pod install
            BUILD_TARGET="-workspace App.xcworkspace"
          else
            BUILD_TARGET="-project App.xcodeproj"
          fi

          xcodebuild \
            $BUILD_TARGET \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            SYMROOT=$(pwd)/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Payload into SocketSimulator.ipa
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r ../../SocketSimulator.ipa Payload

      - name: Upload SocketSimulator.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocketSimulator-iOS-IPA
          path: ${{ steps.locate.outputs.dir }}/SocketSimulator.ipa
